name: Build e Release

# Si attiva quando pushi un tag tipo v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Ricava la versione dal tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verifica coerenza versione <-> tag
        run: |
          TAG_VER="${{ steps.ver.outputs.version }}"
          HEADER_VER=$(grep -oP 'Version:\s*\K[0-9.]+' db-avvisi.php)
          CONST_VER=$(grep -oP "DBAV_VERSION', '\K[0-9.]+" db-avvisi.php)
          echo "Tag=$TAG_VER  Header=$HEADER_VER  Costante=$CONST_VER"
          if [ "$HEADER_VER" != "$TAG_VER" ] || [ "$CONST_VER" != "$TAG_VER" ]; then
            echo "::error::La versione nel file plugin ($HEADER_VER / $CONST_VER) non coincide con il tag ($TAG_VER)."
            exit 1
          fi

      - name: Lint PHP
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Costruisci lo ZIP
        run: |
          SLUG="db-avvisi"
          mkdir -p build/"$SLUG"
          rsync -a ./ build/"$SLUG"/ \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "build" \
            --exclude "node_modules" \
            --exclude "vendor" \
            --exclude "*.zip" \
            --exclude ".DS_Store" \
            --exclude ".gitignore"
          cd build
          zip -r "../${SLUG}-${GITHUB_REF_NAME}.zip" "$SLUG" >/dev/null
          cd ..
          echo "Contenuto pacchetto:"
          unzip -l "${SLUG}-${GITHUB_REF_NAME}.zip"

      - name: Crea la Release e allega lo ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: "DB Avvisi ${{ github.ref_name }}"
          files: db-avvisi-${{ github.ref_name }}.zip
          generate_release_notes: true
